name: llamadart_validation
description: Private cross-platform validation harness for the public llamadart API.
publish_to: none
environment:
  sdk: ^3.10.7
dependencies:
  llamadart:
    path: ../..
  crypto: ^3.0.0
  code_assets: '>=1.0.0 <3.0.0'
  ffi: ^2.1.0
  http: ^1.1.0
  path: ^1.8.3
  yaml: ^3.1.0
dev_dependencies:
  fake_async: ^1.3.3
  lints: ^6.1.0
  test: ^1.26.3
flutter:
  assets:
    - assets/profiles/
    - assets/decision/
    - assets/embeddings/v1/
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes:
        runtimes: [llama_cpp, litert_lm]
        platforms:
          ios-x86_64-sim: [llama_cpp]
          windows-arm64: [llama_cpp]
      llamadart_native_backends:
        platforms:
          linux-x64: [cpu, vulkan, cuda]
          windows-x64: [cpu, vulkan, cuda]
